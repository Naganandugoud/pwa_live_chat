
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PWA Live Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101c;color:white;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{padding:13px;border:0;border-radius:10px;background:#7655ef;color:white;font-weight:bold;cursor:pointer}
input,textarea,select{width:100%;padding:13px;margin:8px 0 15px;background:#25253a;color:white;border:1px solid #484860;border-radius:9px}
label{font-size:14px;color:#ccc}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:390px;background:#1b1b2b;padding:25px;border-radius:18px}
.logo{text-align:center;font-size:26px;font-weight:bold;margin-bottom:28px}
.auth-card h2{text-align:center}
.sub{text-align:center;color:#aaa;font-size:14px;margin-bottom:25px}
.auth-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secondary{background:#393950}
#message,#appMessage{font-size:13px;color:#ffbd70;text-align:center}
#appScreen{display:none}
header{background:#1b1b2b;padding:17px;display:flex;justify-content:space-between;align-items:center}
.container{max-width:700px;margin:auto;padding:18px}
.panel{background:#1b1b2b;padding:17px;border-radius:14px;margin:15px 0}
.room{background:#292940;padding:14px;border-radius:12px;margin:12px 0}
.room small{color:#aaa}
.danger{background:#b7354b}
</style>
</head>
<body>

<section id="authScreen">
 <div class="auth-card">
  <div class="logo">🎙️ PWA LIVE CHAT</div>
  <h2>Welcome!</h2>
  <p class="sub">Login or create your account to continue</p>

  <label>Email Address</label>
  <input id="email" type="email" placeholder="Enter your email">

  <label>Password</label>
  <input id="password" type="password" placeholder="Enter password">

  <div class="auth-buttons">
   <button onclick="login()">Login</button>
   <button class="secondary" onclick="signup()">Create Account</button>
  </div>
  <p id="message"></p>
 </div>
</section>

<section id="appScreen">
 <header>
  <strong>🎙️ PWA LIVE CHAT</strong>
  <button class="secondary" onclick="logout()">Logout</button>
 </header>

 <main class="container">
  <h2>👋 Welcome</h2>
  <p id="userEmail" style="color:#aaa"></p>

  <div class="panel">
   <h3>➕ Create Your Room</h3>

   <label>Room Name</label>
   <input id="roomName" maxlength="40" placeholder="Enter room name">

   <label>Description</label>
   <textarea id="roomDescription" placeholder="Describe your room"></textarea>

   <label>Category</label>
   <select id="category">
    <option>Friendship</option>
    <option>Party</option>
    <option>Music</option>
    <option>Gaming</option>
    <option>Chat</option>
   </select>

   <label>Room Type</label>
   <select id="privacy">
    <option value="false">Public</option>
    <option value="true">Private</option>
   </select>

   <label>Seats</label>
   <select id="seats">
    <option value="4">4 Seats</option>
    <option value="8" selected>8 Seats</option>
    <option value="12">12 Seats</option>
   </select>

   <button style="width:100%" onclick="createRoom()">Create Room</button>
   <p id="appMessage"></p>
  </div>

  <div class="panel">
   <h3>🌍 Public Rooms</h3>
   <div id="roomsList">Loading...</div>
  </div>

  <div class="panel">
   <h3>🏠 My Room</h3>
   <div id="myRoom">Loading...</div>
  </div>
 </main>
</section>

<script>
const SUPABASE_URL = "https://rbfcnagpftqubxhqqzsy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_C0hWEe4qXcoUz26IwWM2PA_w4TKNBda";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;
let authReady = false;

function msg(t){
 document.getElementById("message").textContent=t;
}

function appMsg(t){
 document.getElementById("appMessage").textContent=t;
}

function showLogin(){
 currentUser=null;
 document.getElementById("appScreen").style.display="none";
 document.getElementById("authScreen").style.display="flex";
}

function showApp(user){
 if(!user) return;
 currentUser=user;
 document.getElementById("authScreen").style.display="none";
 document.getElementById("appScreen").style.display="block";
 document.getElementById("userEmail").textContent=user.email || "";
 loadRooms();
}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email || password.length<6){
  msg("Enter a valid email and password (minimum 6 characters).");
  return;
 }
 msg("Creating account...");
 const {data,error}=await db.auth.signUp({email,password});
 if(error){msg(error.message);return;}
 if(data.session){showApp(data.session.user);}
 else{msg("Account created! Confirm your email, then login.");}
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email || !password){msg("Enter email and password.");return;}
 msg("Logging in...");
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){msg(error.message);return;}
 showApp(data.user);
}

async function logout(){
 await db.auth.signOut();
 showLogin();
 msg("Logged out successfully.");
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

async function loadRooms(){
 if(!currentUser)return;

 const {data,error}=await db.from("rooms").select("*")
  .eq("is_private",false).order("created_at",{ascending:false});

 if(error){
  document.getElementById("roomsList").textContent=error.message;
 }else if(!data.length){
  document.getElementById("roomsList").textContent="No public rooms yet.";
 }else{
  document.getElementById("roomsList").innerHTML=data.map(r=>`
   <div class="room">
    <h3>${esc(r.name)}</h3>
    <p>${esc(r.description)}</p>
    <small>${esc(r.category)} · ${r.seat_count} Seats</small>
    <p><button onclick="enterRoom('${r.id}')">Enter Room</button></p>
   </div>`).join("");
 }

 const {data:mine,error:myError}=await db.from("rooms")
  .select("*").eq("owner_id",currentUser.id).maybeSingle();

 if(myError){
  document.getElementById("myRoom").textContent=myError.message;
 }else if(!mine){
  document.getElementById("myRoom").textContent="You haven't created a room yet.";
 }else{
  document.getElementById("myRoom").innerHTML=`
   <div class="room">
    <h3>${esc(mine.name)}</h3>
    <p>${esc(mine.description)}</p>
    <small>${esc(mine.category)} · ${mine.seat_count} Seats</small>
    <p><button class="danger" onclick="deleteRoom('${mine.id}')">Delete My Room</button></p>
   </div>`;
 }
}

async function createRoom(){
 if(!currentUser)return;
 const name=document.getElementById("roomName").value.trim();
 if(name.length<3){appMsg("Room name must be at least 3 characters.");return;}

 appMsg("Creating room...");
 const {error}=await db.from("rooms").insert({
  owner_id:currentUser.id,
  name,
  description:document.getElementById("roomDescription").value.trim(),
  category:document.getElementById("category").value,
  is_private:document.getElementById("privacy").value==="true",
  seat_count:Number(document.getElementById("seats").value)
 });

 if(error){
  appMsg(error.code==="23505"?
   "You already have a room. Delete it before creating another.":
   error.message);
  return;
 }
 appMsg("Room created successfully!");
 document.getElementById("roomName").value="";
 document.getElementById("roomDescription").value="";
 loadRooms();
}

async function deleteRoom(id){
 if(!confirm("Delete your room?"))return;
 const {error}=await db.from("rooms").delete()
  .eq("id",id).eq("owner_id",currentUser.id);
 if(error){appMsg(error.message);return;}
 appMsg("Room deleted.");
 loadRooms();
}

function enterRoom(id){
 alert("Room screen is coming next. Live voice is not connected yet.");
}

async function initialize(){
 const {data,error}=await db.auth.getSession();
 if(error){showLogin();msg(error.message);return;}
 if(data.session?.user)showApp(data.session.user);
 else showLogin();
 authReady=true;
}

db.auth.onAuthStateChange((event,session)=>{
 if(!authReady)return;
 if(session?.user)showApp(session.user);
 else showLogin();
});

initialize();
</script>
</body>
</html>

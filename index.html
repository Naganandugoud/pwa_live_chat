<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWA Live Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101323;color:white;font-family:Arial,sans-serif}
.container{max-width:480px;margin:35px auto;padding:20px}
.card{background:#1c2138;padding:24px;border-radius:18px;margin-bottom:18px}
h1,h2{text-align:center}
h1{color:#9d8cff}
input,select,textarea{width:100%;padding:14px;margin:8px 0;border:1px solid #414967;border-radius:10px;background:#101629;color:white;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#7662ff;color:white;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
button.secondary{background:#303954}
button.danger{background:#d94b60}
.link{text-align:center;color:#b9adff;cursor:pointer;margin-top:18px}
.small{text-align:center;color:#aab0c8;font-size:14px}
.message{text-align:center;margin:12px 0;color:#ffd27a}
.room{background:#252c47;padding:16px;border-radius:12px;margin:12px 0}
.room h3{margin:0 0 8px}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top button{width:auto;padding:10px 15px;margin:0}
</style>
</head>
<body>
<div class="container">

<!-- LOGIN PAGE -->
<section id="loginPage" class="card">
<h1>🎙️ PWA LIVE CHAT</h1>
<p class="small">Welcome! Login to continue</p>
<h2>Login</h2>
<input id="loginEmail" type="email" placeholder="Email Address">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p class="link" onclick="showSignup()">Don't have an account? Create Account</p>
<div id="loginMessage" class="message"></div>
</section>

<!-- SIGNUP PAGE -->
<section id="signupPage" class="card hidden">
<h1>🎙️ PWA LIVE CHAT</h1>
<h2>Create Account</h2>
<input id="signupUsername" type="text" placeholder="Username">
<input id="signupEmail" type="email" placeholder="Email Address">
<input id="signupPassword" type="password" placeholder="Password (minimum 6 characters)">
<input id="confirmPassword" type="password" placeholder="Confirm Password">
<button onclick="signup()">Create Account</button>
<p class="link" onclick="showLogin()">Already have an account? Login</p>
<div id="signupMessage" class="message"></div>
</section>

<!-- HOME / ROOMS PAGE -->
<section id="homePage" class="hidden">
<div class="top">
<h2>🎙️ Live Rooms</h2>
<button class="secondary" onclick="logout()">Logout</button>
</div>
<p id="welcomeText" class="small"></p>

<div class="card">
<h2>Create Room</h2>
<input id="roomName" maxlength="40" placeholder="Room Name (3-40 characters)">
<textarea id="roomDescription" placeholder="Room Description"></textarea>
<select id="roomCategory">
<option>Friendship</option>
<option>Party</option>
<option>Music</option>
<option>Gaming</option>
<option>Chat</option>
</select>
<select id="roomSeats">
<option value="4">4 Seats</option>
<option value="8" selected>8 Seats</option>
<option value="12">12 Seats</option>
</select>
<button onclick="createRoom()">Create Room</button>
<div id="roomMessage" class="message"></div>
</div>

<div class="card">
<h2>Public Rooms</h2>
<button class="secondary" onclick="loadRooms()">Refresh Rooms</button>
<div id="roomsList"></div>
</div>
</section>

</div>

<script>
const SUPABASE_URL = "https://rbfcnagpftqubxhqqzsy.supabase.co";
const SUPABASE_KEY = "sb_publishable_C0hWEe4qXcoUz26IwWM2PA_w4TKNBda";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

function showPage(page) {
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("signupPage").classList.add("hidden");
  document.getElementById("homePage").classList.add("hidden");
  document.getElementById(page).classList.remove("hidden");
}

function showLogin() {
  showPage("loginPage");
  document.getElementById("signupMessage").textContent = "";
}

function showSignup() {
  showPage("signupPage");
  document.getElementById("loginMessage").textContent = "";
}

function showHome(user) {
  currentUser = user;
  showPage("homePage");
  const username = user.user_metadata?.username || user.email;
  document.getElementById("welcomeText").textContent =
    "Welcome, " + username + "!";
  loadRooms();
}

async function signup() {
  const username = document.getElementById("signupUsername").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("signupMessage");

  msg.textContent = "";

  if (!username) {
    msg.textContent = "Please enter username.";
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    msg.textContent = "Enter a valid email address.";
    return;
  }
  if (password.length < 6) {
    msg.textContent = "Password minimum 6 characters undali.";
    return;
  }
  if (password !== confirm) {
    msg.textContent = "Passwords do not match.";
    return;
  }

  msg.textContent = "Creating account...";

  const { data, error } = await supabase.auth.signUp({
    email: email,
    password: password,
    options: {
      data: { username: username }
    }
  });

  if (error) {
    msg.textContent = error.message;
    return;
  }

  if (data.session) {
    showHome(data.user);
  } else {
    showLogin();
    document.getElementById("loginMessage").textContent =
      "Account created! Email confirmation required ayithe email verify chesi login avvandi.";
  }
}

async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMessage");

  msg.textContent = "";

  if (!email || !password) {
    msg.textContent = "Enter email and password.";
    return;
  }

  msg.textContent = "Logging in...";

  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    msg.textContent = "Login failed. Check email and password, or create an account.";
    return;
  }

  showHome(data.user);
}

async function logout() {
  await supabase.auth.signOut();
  currentUser = null;
  showLogin();
}

async function createRoom() {
  const msg = document.getElementById("roomMessage");
  const name = document.getElementById("roomName").value.trim();
  const description = document.getElementById("roomDescription").value.trim();
  const category = document.getElementById("roomCategory").value;
  const seat_count = Number(document.getElementById("roomSeats").value);

  msg.textContent = "";

  if (!currentUser) {
    msg.textContent = "Please login first.";
    return;
  }
  if (name.length < 3 || name.length > 40) {
    msg.textContent = "Room name 3 to 40 characters undali.";
    return;
  }

  msg.textContent = "Creating room...";

  const { error } = await supabase
    .from("rooms")
    .insert({
      owner_id: currentUser.id,
      name,
      description,
      category,
      seat_count,
      is_private: false
    });

  if (error) {
    if (error.code === "23505") {
      msg.textContent = "You already have a room. Delete your old room first.";
    } else {
      msg.textContent = error.message;
    }
    return;
  }

  msg.textContent = "Room created successfully!";
  document.getElementById("roomName").value = "";
  document.getElementById("roomDescription").value = "";
  loadRooms();
}

async function loadRooms() {
  const list = document.getElementById("roomsList");
  list.textContent = "Loading rooms...";

  const { data, error } = await supabase
    .from("rooms")
    .select("id, owner_id, name, description, category, seat_count, created_at")
    .eq("is_private", false)
    .order("created_at", { ascending: false });

  if (error) {
    list.textContent = error.message;
    return;
  }

  list.innerHTML = "";

  if (!data || data.length === 0) {
    list.textContent = "No public rooms yet. Create the first room!";
    return;
  }

  data.forEach(room => {
    const div = document.createElement("div");
    div.className = "room";

    const heading = document.createElement("h3");
    heading.textContent = "🎙️ " + room.name;

    const desc = document.createElement("p");
    desc.textContent = room.description || "No description";

    const details = document.createElement("p");
    details.className = "small";
    details.textContent =
      room.category + " • " + room.seat_count + " seats";

    div.append(heading, desc, details);

    if (currentUser && room.owner_id === currentUser.id) {
      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "Delete My Room";
      del.onclick = () => deleteRoom(room.id);
      div.appendChild(del);
    }

    list.appendChild(div);
  });
}

async function deleteRoom(roomId) {
  if (!confirm("Are you sure you want to delete your room?")) return;

  const { error } = await supabase
    .from("rooms")
    .delete()
    .eq("id", roomId)
    .eq("owner_id", currentUser.id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Room deleted.");
  loadRooms();
}

async function checkSession() {
  const { data, error } = await supabase.auth.getSession();

  if (error) {
    showLogin();
    return;
  }

  if (data.session) {
    showHome(data.session.user);
  } else {
    showLogin();
  }
}

supabase.auth.onAuthStateChange((event, session) => {
  if (session && !currentUser) {
    showHome(session.user);
  } else if (!session && currentUser) {
    currentUser = null;
    showLogin();
  }
});

checkSession();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>PWA Live Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:#f4f6fa;color:#222;
 padding-bottom:80px
}
header{
 background:#fff;padding:17px;
 position:sticky;top:0;z-index:5;
 box-shadow:0 2px 8px #0000000a
}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:bold;color:#20b99a}
main{padding:15px;max-width:700px;margin:auto}
.tabs{display:flex;gap:20px;margin-top:15px}
.tabs button{border:0;background:none;font-weight:bold;color:#777}
.tabs button.active{color:#20b99a}
.categories{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:10px;margin:18px 0
}
.category{text-align:center}
.emoji{
 background:#e8e5ff;border-radius:14px;
 padding:17px;font-size:27px
}
.category b{font-size:12px;display:block;margin-top:7px}
.panel{
 background:white;padding:17px;
 border-radius:14px;margin:13px 0;
 box-shadow:0 2px 8px #00000008
}
.room{
 display:flex;align-items:center;gap:12px;
 background:white;padding:13px;
 border-radius:13px;margin:12px 0;
 cursor:pointer
}
.avatar{
 width:65px;height:65px;border-radius:13px;
 background:linear-gradient(135deg,#d6c5ff,#a6e6db);
 display:grid;place-items:center;
 font-size:30px;flex-shrink:0
}
.room-info{flex:1;min-width:0}
.room-title{font-weight:bold;margin-bottom:7px}
.desc{font-size:12px;color:#999}
.tag{
 display:inline-block;background:#e1f7ed;
 color:#168e6d;padding:5px 9px;
 border-radius:15px;font-size:11px;margin-top:7px
}
button{
 cursor:pointer
}
.action{
 background:#20b99a;color:white;border:0;
 border-radius:9px;padding:13px 17px;
 margin-top:12px;font-weight:bold;width:100%
}
.secondary{
 background:#eee;color:#333;border:0;
 border-radius:9px;padding:12px;margin-top:10px;width:100%
}
.danger{background:#ffe5e5;color:#c33}
input,select,textarea{
 width:100%;padding:13px;
 border:1px solid #ddd;border-radius:9px;
 margin:8px 0 14px;font-size:15px;
 background:white
}
label{font-size:13px;font-weight:bold}
.page-title{font-size:22px;margin:12px 0 18px}
nav{
 position:fixed;bottom:0;left:0;width:100%;
 background:white;border-top:1px solid #eee;
 display:flex;justify-content:space-around;
 padding:10px 2px calc(10px + env(safe-area-inset-bottom));
 z-index:10
}
nav button{
 border:0;background:none;color:#888;
 font-size:11px;font-weight:bold;flex:1
}
nav span{display:block;font-size:23px;margin-bottom:4px}
nav button.active{color:#20b99a}
.small{font-size:12px;color:#999}
.center{text-align:center}
.hidden{display:none}
.error{color:#d33;font-size:13px;margin:8px 0}
.success{color:#15966f;font-size:13px;margin:8px 0}
</style>
</head>

<body>

<header>
 <div class="top">
  <div class="logo">🎙️ PWA LIVE CHAT</div>
  <div id="userStatus" class="small">Guest</div>
 </div>
 <div class="tabs">
  <button class="active">Related</button>
  <button onclick="go('Room')">Party</button>
  <button onclick="go('Discover')">Activity</button>
 </div>
</header>

<main id="app"></main>

<nav>
 <button class="active" onclick="go('Room',this)">
  <span>🏠</span>Room
 </button>
 <button onclick="go('Gaming',this)">
  <span>🎮</span>Gaming
 </button>
 <button onclick="go('Discover',this)">
  <span>🌐</span>Discover
 </button>
 <button onclick="go('Message',this)">
  <span>💬</span>Message
 </button>
 <button onclick="go('Me',this)">
  <span>👤</span>Me
 </button>
</nav>

<script>
// ===================================
// SUPABASE CONFIGURATION
// ===================================

const SUPABASE_URL =
"https://rbfcnagpftqubxhqqzsy.supabase.co";

const SUPABASE_KEY =
"PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const app = document.getElementById("app");

let currentUser = null;
let myRoom = null;
let currentRoom = null;
let allRooms = [];

// ===================================
// HELPER FUNCTIONS
// ===================================

function esc(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function message(text,type="error"){
 const el=document.getElementById("message");
 if(el){
  el.className=type;
  el.textContent=text;
 }
}

function loading(text="Please wait..."){
 app.innerHTML=`<div class="panel center">${esc(text)}</div>`;
}

async function getUser(){
 const {data,error}=await db.auth.getSession();
 if(error) console.error(error);
 currentUser=data.session?.user || null;
 document.getElementById("userStatus").textContent=
 currentUser ? "🟢 "+(currentUser.email || "Member") : "Guest";
}

// ===================================
// LOGIN / SIGNUP
// ===================================

function authPage(){
 app.innerHTML=`
 <h2 class="page-title">👋 Welcome</h2>

 <div class="panel">
  <h3>Login / Create Account</h3>
  <p class="small">Join PWA Live Chat</p>

  <label>Email Address</label>
  <input id="email" type="email" placeholder="Enter email">

  <label>Password</label>
  <input id="password" type="password"
   placeholder="Minimum 6 characters">

  <div id="message"></div>

  <button class="action" onclick="login()">
   Login
  </button>

  <button class="secondary" onclick="signup()">
   Create New Account
  </button>
 </div>
 `;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email || !password){
  message("Enter email and password");
  return;
 }

 const {error}=await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  message(error.message);
  return;
 }

 await initialize();
 go("Room");
}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email || password.length<6){
  message("Enter valid email and password (minimum 6 characters)");
  return;
 }

 const {data,error}=await db.auth.signUp({
  email,password
 });

 if(error){
  message(error.message);
  return;
 }

 if(data.session){
  await initialize();
  go("Room");
 }else{
  app.innerHTML=`
   <div class="panel center">
    <h2>📩 Verify Your Email</h2>
    <p>Check your email and confirm your account.
    Then return and login.</p>
    <button class="action" onclick="authPage()">Back to Login</button>
   </div>`;
 }
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 myRoom=null;
 go("Me");
}

// ===================================
// LOAD ROOMS
// ===================================

async function loadRooms(){
 if(!currentUser){
  allRooms=[];
  myRoom=null;
  return;
 }

 const {data,error}=await db
  .from("rooms")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  console.error(error);
  alert("Unable to load rooms: "+error.message);
  return;
 }

 allRooms=data || [];

 myRoom=allRooms.find(
  room=>room.owner_id===currentUser.id
 ) || null;
}

// ===================================
// HOME PAGE
// ===================================

async function home(){
 loading("Loading rooms...");
 await getUser();

 if(!currentUser){
  authPage();
  return;
 }

 await loadRooms();

 app.innerHTML=`
 <h2 class="page-title">🎙️ Voice Chat Rooms</h2>

 <div class="categories">
  <div class="category">
   <div class="emoji">🏆</div><b>Ranking</b>
  </div>
  <div class="category">
   <div class="emoji">💕</div><b>Couple</b>
  </div>
  <div class="category">
   <div class="emoji">🥊</div><b>Room PK</b>
  </div>
 </div>

 <div class="panel">
  <h3>🏠 Your Room</h3>
  <div id="myRoomArea"></div>
 </div>

 <h3 style="margin:20px 0">🔥 Public Rooms</h3>
 <input id="search" placeholder="Search rooms..."
  oninput="filterRooms()">

 <div id="roomList"></div>

 <div class="panel center">
  🎁 Welcome to PWA Live Chat!
  <p class="small">Meet friends and enjoy conversations.</p>
 </div>
 `;

 renderMyRoom();
 renderRooms();
}

function renderMyRoom(){
 const area=document.getElementById("myRoomArea");
 if(!area)return;

 if(myRoom){
  area.innerHTML=`
   <div class="room" onclick="enterRoom('${myRoom.id}')">
    <div class="avatar">🎙️</div>
    <div class="room-info">
     <div class="room-title">${esc(myRoom.name)}</div>
     <div class="desc">Your Room • Owner</div>
     <span class="tag">Your Room</span>
    </div>
   </div>
   <button class="action" onclick="enterRoom('${myRoom.id}')">
    Open My Room
   </button>
   <button class="secondary danger"
    onclick="deleteRoom('${myRoom.id}')">
    Delete My Room
   </button>
  `;
 }else{
  area.innerHTML=`
   <p class="small">You have not created a room yet.</p>
   <button class="action" onclick="createRoomPage()">
    ➕ Create Your Room
   </button>
  `;
 }
}

function renderRooms(){
 const list=document.getElementById("roomList");
 if(!list)return;

 const publicRooms=allRooms.filter(r=>
  !r.is_private || r.owner_id===currentUser.id
 );

 if(!publicRooms.length){
  list.innerHTML=`<div class="panel center">
   No rooms available yet. Create the first room!
  </div>`;
  return;
 }

 list.innerHTML=publicRooms.map(r=>`
  <div class="room" onclick="enterRoom('${r.id}')">
   <div class="avatar">🎙️</div>
   <div class="room-info">
    <div class="room-title">${esc(r.name)}</div>
    <div class="desc">${esc(r.description)}</div>
    <span class="tag">${esc(r.category)}</span>
    <span class="tag">${r.seat_count} Seats</span>
    ${r.is_private?'<span class="tag">🔒 Private</span>':''}
   </div>
  </div>
 `).join("");
}

function filterRooms(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=document.getElementById("roomList");

 const results=allRooms.filter(r=>
  (!r.is_private || r.owner_id===currentUser.id) &&
  r.name.toLowerCase().includes(q)
 );

 list.innerHTML=results.length
 ? results.map(r=>`
  <div class="room" onclick="enterRoom('${r.id}')">
   <div class="avatar">🎙️</div>
   <div class="room-info">
    <div class="room-title">${esc(r.name)}</div>
    <div class="desc">${esc(r.description)}</div>
    <span class="tag">${esc(r.category)}</span>
   </div>
  </div>
 `).join("")
 : "<div class='panel'>No rooms found.</div>";
}

// ===================================
// CREATE ROOM
// ===================================

function createRoomPage(){
 if(!currentUser){
  authPage();
  return;
 }

 if(myRoom){
  alert("You can create only ONE room per account.");
  home();
  return;
 }

 app.innerHTML=`
 <h2 class="page-title">➕ Create Your Room</h2>

 <div class="panel">

  <label>Room Name</label>
  <input id="roomName" maxlength="40"
   placeholder="Enter room name">

  <label>Description</label>
  <textarea id="roomDescription"
   placeholder="Welcome to my room"></textarea>

  <label>Category</label>
  <select id="roomCategory">
   <option>Friendship</option>
   <option>Party</option>
   <option>Music</option>
   <option>Gaming</option>
   <option>Chat</option>
  </select>

  <label>Room Privacy</label>
  <select id="roomPrivacy">
   <option value="false">Public</option>
   <option value="true">Private</option>
  </select>

  <label>Mic Seats</label>
  <select id="roomSeats">
   <option value="4">4 Seats</option>
   <option value="8" selected>8 Seats</option>
   <option value="12">12 Seats</option>
  </select>

  <div id="message"></div>

  <button class="action" onclick="createRoom()">
   Create Room
  </button>

  <button class="secondary" onclick="go('Room')">
   Cancel
  </button>

 </div>
 `;

}

async function createRoom(){
 if(!currentUser){
  alert("Please login first");
  authPage();
  return;
 }

 const name=document.getElementById("roomName").value.trim();
 const description=document.getElementById("roomDescription").value.trim();
 const category=document.getElementById("roomCategory").value;
 const is_private=document.getElementById("roomPrivacy").value==="true";
 const seat_count=Number(document.getElementById("roomSeats").value);

 if(name.length<3 || name.length>40){
  message("Room name must be 3 to 40 characters");
  return;
 }

 if(![4,8,12].includes(seat_count)){
  message("Invalid seat count");
  return;
 }

 const button=document.querySelector(".action");
 button.disabled=true;
 button.textContent="Creating...";

 const {data,error}=await db
  .from("rooms")
  .insert({
   owner_id:currentUser.id,
   name,
   description,
   category,
   is_private,
   seat_count
  })
  .select()
  .single();

 if(error){
  button.disabled=false;
  button.textContent="Create Room";

  if(error.code==="23505"){
   message("You already own a room. Only one room is allowed.");
  }else{
   message(error.message);
  }
  return;
 }

 alert("Your room was created successfully!");

 await home();
}

// ===================================
// DELETE ROOM
// ===================================

async function deleteRoom(id){
 if(!confirm("Are you sure you want to delete your room?"))return;

 const {error}=await db
  .from("rooms")
  .delete()
  .eq("id",id)
  .eq("owner_id",currentUser.id);

 if(error){
  alert(error.message);
  return;
 }

 alert("Room deleted successfully!");
 await home();
}

// ===================================
// ENTER ROOM
// ===================================

async function enterRoom(id){
 const room=allRooms.find(r=>r.id===id);

 if(!room)return;

 currentRoom=room;

 app.innerHTML=`
 <h2 class="page-title">🎙️ ${esc(room.name)}</h2>

 <div class="panel center">
  <div style="font-size:55px">🎤</div>
  <h3>${esc(room.name)}</h3>
  <p class="small">${esc(room.description)}</p>
  <span class="tag">${esc(room.category)}</span>
  <span class="tag">${room.seat_count} Seats</span>
 </div>

 <div class="categories">
  <div class="category">
   <div class="emoji">📥</div><b>Inbox</b>
  </div>
  <div class="category">
   <div class="emoji">🎁</div><b>Gifts</b>
  </div>
  <div class="category">
   <div class="emoji">👥</div><b>Members</b>
  </div>
 </div>

 <div class="panel center">
  <h3>🎙️ Voice Room</h3>
  <p class="small" style="margin-top:10px">
   Voice connection is not integrated yet.
  </p>
  <p class="small">Mic seats: ${room.seat_count}</p>
 </div>

 ${room.owner_id===currentUser.id?`
  <div class="panel">
   <h3>👑 Room Owner</h3>
   <p class="small">You are the owner of this room.</p>
   <button class="secondary danger"
    onclick="deleteRoom('${room.id}')">
    Delete Room
   </button>
  </div>
 `:""}

 <button class="action" onclick="go('Room')">
  Leave Room
 </button>
 `;

}

// ===================================
// OTHER PAGES
// ===================================

function go(page,btn){
 document.querySelectorAll("nav button")
  .forEach(x=>x.classList.remove("active"));

 if(btn)btn.classList.add("active");

 if(page==="Room"){
  home();
 }

 if(page==="Gaming"){
  app.innerHTML=`
   <h2 class="page-title">🎮 Gaming</h2>
   <div class="panel">Games coming soon.</div>
  `;
 }

 if(page==="Discover"){
  app.innerHTML=`
   <h2 class="page-title">🌐 Discover</h2>
   <div class="panel">Discover new friends and rooms.</div>
  `;
 }

 if(page==="Message"){
  app.innerHTML=`
   <h2 class="page-title">💬 Messages</h2>
   <div class="panel">Messaging feature coming soon.</div>
  `;
 }

 if(page==="Me"){
  profilePage();
 }
}

async function profilePage(){
 await getUser();

 if(!currentUser){
  authPage();
  return;
 }

 app.innerHTML=`
 <h2 class="page-title">👤 My Profile</h2>

 <div class="panel center">
  <div style="font-size:55px">🙂</div>
  <h3>${esc(currentUser.email)}</h3>
  <p class="small">PWA Live Chat Member</p>
 </div>

 <div class="panel">
  <h3>🏠 My Room</h3>
  <p class="small">${myRoom?esc(myRoom.name):"No room created"}</p>
  <button class="action" onclick="go('Room')">
   View My Room
  </button>
 </div>

 <div class="panel">
  <h3>👑 VIP Membership</h3>
  <p class="small">Premium features coming soon.</p>
 </div>

 <button class="action danger" onclick="logout()">
  Logout
 </button>
` ;
}

// ===================================
// START APPLICATION
// ===================================

async function initialize(){
 await getUser();
 if(currentUser){
  await loadRooms();
 }
}

db.auth.onAuthStateChange((event,session)=>{
 currentUser=session?.user || null;
 document.getElementById("userStatus").textContent=
 currentUser ? "🟢 Member" : "Guest";
});

(async()=>{
 await initialize();
 if(currentUser){
  await home();
 }else{
  authPage();
 }
})();

</script>
</body>
</html>
